<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <style>
    .class { fill: white; stroke: black; stroke-width: 2; }
    .title { font: bold 20px sans-serif; }
    .text { font: 16px sans-serif; }
    .small { font: 14px sans-serif; }
    .line { stroke: black; stroke-width: 2; fill: none; }
    .dash { stroke: black; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
    .abstract { font-style: italic; }
  </style>

  <!-- DOMAIN -->

  <rect class="class" x="60" y="60" width="300" height="210"/>
  <text class="title" x="210" y="90" text-anchor="middle">Cuenta</text>
  <line class="line" x1="60" y1="105" x2="360" y2="105"/>
  <text class="text" x="80" y="135">+ id: str</text>
  <text class="text" x="80" y="160">+ titular: str</text>
  <text class="text" x="80" y="185">- _saldo: float</text>
  <line class="line" x1="60" y1="200" x2="360" y2="200"/>
  <text class="small" x="80" y="225">+ saldo: float</text>
  <text class="small" x="80" y="247">+ depositar(monto): None</text>
  <text class="small" x="80" y="267">+ retirar(monto): None</text>

  <rect class="class" x="420" y="60" width="340" height="230"/>
  <text class="title" x="590" y="90" text-anchor="middle">Transaccion</text>
  <line class="line" x1="420" y1="105" x2="760" y2="105"/>
  <text class="text" x="440" y="135">+ id: str</text>
  <text class="text" x="440" y="160">+ cuenta_id: str</text>
  <text class="text" x="440" y="185">+ monto: float</text>
  <text class="text" x="440" y="210">- _estado: str</text>
  <line class="line" x1="420" y1="225" x2="760" y2="225"/>
  <text class="small" x="440" y="250">+ estado: str</text>
  <text class="small" x="440" y="272">+ aprobar(): None</text>
  <text class="small" x="440" y="292">+ rechazar(): None</text>

  <rect class="class" x="820" y="60" width="320" height="210"/>
  <text class="title" x="980" y="90" text-anchor="middle">Suscripcion</text>
  <line class="line" x1="820" y1="105" x2="1140" y2="105"/>
  <text class="text" x="840" y="135">+ id: str</text>
  <text class="text" x="840" y="160">+ cuenta_id: str</text>
  <text class="text" x="840" y="185">+ monto_recurrente: float</text>
  <text class="text" x="840" y="210">+ activa: bool</text>
  <line class="line" x1="820" y1="225" x2="1140" y2="225"/>
  <text class="small" x="840" y="250">+ cancelar(): None</text>
  <text class="small" x="840" y="270">+ reactivar(): None</text>

  <!-- PAYMENTS -->

  <rect class="class" x="60" y="360" width="300" height="190"/>
  <text class="title abstract" x="210" y="395" text-anchor="middle">MetodoPago</text>
  <line class="line" x1="60" y1="410" x2="360" y2="410"/>
  <text class="text" x="80" y="445">«ABC»</text>
  <line class="line" x1="60" y1="460" x2="360" y2="460"/>
  <text class="small abstract" x="80" y="490">+ procesar(monto)</text>
  <text class="small" x="80" y="515">→ bool</text>

  <rect class="class" x="420" y="360" width="270" height="150"/>
  <text class="title" x="555" y="395" text-anchor="middle">Tarjeta</text>
  <line class="line" x1="420" y1="410" x2="690" y2="410"/>
  <text class="text" x="440" y="440">+ numero_enmascarado</text>
  <line class="line" x1="420" y1="455" x2="690" y2="455"/>
  <text class="small" x="440" y="485">+ procesar(monto): bool</text>

  <rect class="class" x="740" y="360" width="300" height="150"/>
  <text class="title" x="890" y="395" text-anchor="middle">Transferencia</text>
  <line class="line" x1="740" y1="410" x2="1040" y2="410"/>
  <text class="text" x="760" y="440">+ cuenta_bancaria</text>
  <line class="line" x1="740" y1="455" x2="1040" y2="455"/>
  <text class="small" x="760" y="485">+ procesar(monto): bool</text>

  <rect class="class" x="1090" y="360" width="300" height="150"/>
  <text class="title" x="1240" y="395" text-anchor="middle">Wallet</text>
  <line class="line" x1="1090" y1="410" x2="1390" y2="410"/>
  <text class="text" x="1110" y="440">+ proveedor</text>
  <line class="line" x1="1090" y1="455" x2="1390" y2="455"/>
  <text class="small" x="1110" y="485">+ procesar(monto): bool</text>

  <!-- STRATEGY -->

  <rect class="class" x="60" y="650" width="330" height="170"/>
  <text class="title abstract" x="225" y="685" text-anchor="middle">EstrategiaComision</text>
  <line class="line" x1="60" y1="700" x2="390" y2="700"/>
  <text class="text" x="80" y="730">«ABC»</text>
  <line class="line" x1="60" y1="745" x2="390" y2="745"/>
  <text class="small abstract" x="80" y="775">+ calcular(monto)</text>
  <text class="small" x="80" y="800">→ float</text>

  <rect class="class" x="430" y="650" width="280" height="150"/>
  <text class="title" x="570" y="685" text-anchor="middle">ComisionFija</text>
  <line class="line" x1="430" y1="700" x2="710" y2="700"/>
  <text class="text" x="450" y="730">+ monto_fijo: float</text>
  <line class="line" x1="430" y1="745" x2="710" y2="745"/>
  <text class="small" x="450" y="775">+ calcular(monto): float</text>

  <rect class="class" x="750" y="650" width="300" height="150"/>
  <text class="title" x="900" y="685" text-anchor="middle">ComisionPorcentual</text>
  <line class="line" x1="750" y1="700" x2="1050" y2="700"/>
  <text class="text" x="770" y="730">+ porcentaje: float</text>
  <line class="line" x1="750" y1="745" x2="1050" y2="745"/>
  <text class="small" x="770" y="775">+ calcular(monto): float</text>

  <!-- FACTORY / ENGINE -->

  <rect class="class" x="1110" y="600" width="300" height="190"/>
  <text class="title" x="1260" y="635" text-anchor="middle">MetodoPagoFactory</text>
  <line class="line" x1="1110" y1="650" x2="1410" y2="650"/>
  <text class="small" x="1130" y="680">- _tipos: dict</text>
  <line class="line" x1="1110" y1="695" x2="1410" y2="695"/>
  <text class="small" x="1130" y="725">+ crear(tipo, id)</text>
  <text class="small" x="1130" y="750">+ registrar(tipo, constructor)</text>

  <rect class="class" x="500" y="880" width="360" height="130"/>
  <text class="title" x="680" y="915" text-anchor="middle">PagoEngine</text>
  <line class="line" x1="500" y1="930" x2="860" y2="930"/>
  <text class="small" x="520" y="955">- estrategia_comision</text>
  <text class="small" x="520" y="978">- gestor_eventos</text>
  <text class="small" x="520" y="1001">+ procesar_pago(...): ResultadoPago</text>

  <!-- OBSERVER -->

  <rect class="class" x="60" y="880" width="330" height="130"/>
  <text class="title" x="225" y="915" text-anchor="middle">GestorEventosPago</text>
  <line class="line" x1="60" y1="930" x2="390" y2="930"/>
  <text class="small" x="80" y="955">- _observadores: list</text>
  <text class="small" x="80" y="978">+ suscribir(observador)</text>
  <text class="small" x="80" y="1001">+ notificar(evento)</text>

  <rect class="class" x="930" y="870" width="250" height="140"/>
  <text class="title" x="1055" y="905" text-anchor="middle">EventoPago</text>
  <line class="line" x1="930" y1="920" x2="1180" y2="920"/>
  <text class="text" x="950" y="950">+ transaccion</text>
  <text class="text" x="950" y="975">+ mensaje</text>

  <rect class="class" x="1210" y="850" width="240" height="100"/>
  <text class="title" x="1330" y="885" text-anchor="middle">PagoAprobado</text>
  <line class="line" x1="1210" y1="900" x2="1450" y2="900"/>
  <text class="small" x="1230" y="925">Evento de aprobación</text>

  <rect class="class" x="1210" y="960" width="240" height="100"/>
  <text class="title" x="1330" y="995" text-anchor="middle">PagoRechazado</text>
  <line class="line" x1="1210" y1="1010" x2="1450" y2="1010"/>
  <text class="small" x="1230" y="1035">Evento de rechazo</text>

  <!-- OBSERVER INTERFACE -->

  <rect class="class" x="930" y="690" width="250" height="120"/>
  <text class="title abstract" x="1055" y="725" text-anchor="middle">ObservadorPago</text>
  <line class="line" x1="930" y1="740" x2="1180" y2="740"/>
  <text class="text" x="950" y="770">«ABC»</text>
  <text class="small abstract" x="950" y="795">+ actualizar(evento)</text>

  <!-- INHERITANCE -->

  <path class="line" d="M210 360 L210 300"/>
  <polygon points="200,310 210,290 220,310" fill="white" stroke="black"/>

  <path class="line" d="M555 360 L300 300"/>
  <polygon points="300,290 300,310 280,300" fill="white" stroke="black"/>

  <path class="line" d="M890 360 L330 300"/>
  <polygon points="330,290 330,310 310,300" fill="white" stroke="black"/>

  <path class="line" d="M1240 360 L350 300"/>
  <polygon points="350,290 350,310 330,300" fill="white" stroke="black"/>

  <path class="line" d="M570 650 L225 570"/>
  <polygon points="225,560 225,580 205,570" fill="white" stroke="black"/>

  <path class="line" d="M900 650 L245 570"/>
  <polygon points="245,560 245,580 225,570" fill="white" stroke="black"/>

  <path class="line" d="M1055 870 L1055 820"/>
  <polygon points="1045,830 1055,810 1065,830" fill="white" stroke="black"/>

  <path class="line" d="M1210 900 L1180 900"/>
  <polygon points="1190,890 1170,900 1190,910" fill="white" stroke="black"/>

  <path class="line" d="M1210 1010 L1180 930"/>
  <polygon points="1190,925 1175,915 1185,935" fill="white" stroke="black"/>

  <!-- ASSOCIATIONS -->

  <path class="dash" d="M680 880 L680 820"/>
  <text class="small" x="690" y="850">usa</text>

  <path class="dash" d="M500 940 L390 940"/>
  <text class="small" x="405" y="930">notifica</text>

  <path class="dash" d="M860 940 L930 940"/>
  <text class="small" x="865" y="930">genera</text>

  <path class="dash" d="M1110 700 L1040 700"/>
  <text class="small" x="1060" y="685">crea</text>
</svg>
