[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitpay"
version = "1.0.0"
description = "Motor de pagos y suscripciones orientado a objetos para OrbitPay LATAM"
readme = "README.md"
requires-python = ">=3.11"
license =  "MIT"
authors = [
    { name = "Luis Angel Leyva Castillo" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "black>=24,<27",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3,<5",
    "build>=1,<2"
]

[tool.setuptools.packages.find]
include = ["orbitpay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true